[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "researchpaper-ai-api"
version = "0.1.0"
description = "Local research paper retrieval and evaluation API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.8.1",
    "structlog==25.2.0",
    "pymupdf==1.25.5",
    "rank-bm25==0.2.2",
    "sentence-transformers==3.4.1",
    "transformers==4.49.0",
    "faiss-cpu==1.10.0",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.2", "debugpy==1.8.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]